name: server
# See https://www.digitalocean.com/docs/app-platform/#regional-availability for the available options
# You can get region slugs from https://www.digitalocean.com/docs/platform/availability-matrix/
# `tor1` = Toronto: closest App Platform region to Vancouver visitors.
region: tor1
services:
  - name: server
    # The server lives in the server/ folder of the monorepo: that folder is the
    # Docker build context, and the Dockerfile path is relative to the repo root.
    dockerfile_path: server/Dockerfile
    source_dir: server
    github:
      branch: main
      deploy_on_push: true
      repo: sahilsian/siansahil
    # Active probe used by DigitalOcean's to ensure our application is healthy
    health_check:
      # The path to our health check endpoint! It turned out to be useful in the end!
      http_path: /api/v1/diagnostics/health_check
    # The port the application will be listening on for incoming requests
    # It should match what we specify in our configuration.yaml file!
    http_port: 8000
    # For production workloads we'd go for at least two!
    instance_count: 1
    # Let's keep the bill lean for now...
    instance_size_slug: basic-xxs
    # All incoming requests should be routed to our app
    routes:
      - path: /
    envs:
      - key: APP_DATABASE__USERNAME
        scope: RUN_TIME
        value: ${newsletter.USERNAME}
      - key: APP_DATABASE__PASSWORD
        scope: RUN_TIME
        value: ${newsletter.PASSWORD}
      - key: APP_DATABASE__HOST
        scope: RUN_TIME
        value: ${newsletter.HOSTNAME}
      - key: APP_DATABASE__PORT
        scope: RUN_TIME
        value: ${newsletter.PORT}
      - key: APP_DATABASE__DATABASE_NAME
        scope: RUN_TIME
        value: ${newsletter.DATABASE}
      # Admin API key (min 32 chars). Set the value in the DigitalOcean dashboard;
      # never commit it. The server refuses to start without it.
      - key: APP_ADMIN__API_KEY
        scope: RUN_TIME
        type: SECRET
      # Resend API key for mailing-list notification emails. Without it the
      # server still runs, but notifications are skipped (logged).
      - key: APP_EMAIL__RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
databases:
  # PG = Postgres
  - engine: PG
    # Database name
    name: newsletter
    # Again, let's keep the bill lean
    num_nodes: 1
    size: db-s-dev-database
    # Postgres version - using the latest here
    version: "17"